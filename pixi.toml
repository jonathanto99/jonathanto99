[workspace]
authors = ["Jonathan (ShueYi) To <toshuyi@outlook.com>"]
channels = ["conda-forge"]
name = "jonathanto99"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks.start]
cmd = "positron ."

[tasks.lint]
cmd = "ruff check --fix programs tests setup && ruff format programs tests setup"

[dependencies]
python = ">=3.14,<3.15"
numpy = ">=2.5.1,<3"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.1,<4"
polars = ">=1.43.2,<2"
plotnine = ">=0.15.8,<0.16"
ruff = ">=0.16.2,<0.17"
scanpy = ">=1.12.3,<2"
pytorch = ">=2.13.0,<3"
sklearn = ">=1.3.2,<2"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
mypy = ">=1.19.0,<2"
rich = ">=14.0.0,<15"
r-base = ">=4.4,<4.5"
r-tidyverse = ">=2.0.0,<3"
r-haven = ">=2.5.4,<2.6"
r-patchwork = ">=1.3.0,<1.4"
r-janitor = ">=2.2.0,<2.3"
r-shiny = ">=1.12.0,<1.13"
r-plotly = ">=4.11.0,<4.12"
r-readxl = ">=1.4.5,<1.5"
r-writexl = ">=1.5.0,<1.6"
r-ggprism = ">=1.0.6,<1.1"
